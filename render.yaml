# Render blueprint for the FastAPI backend — the documented alternative to Railway.
#
# No Docker: Render's native Python runtime installs from requirements.txt, which is
# one less moving part than maintaining an image for a plain ASGI app.
#
# SQLite is a file, so this service needs a filesystem that survives restarts. Render
# only attaches persistent disks to *paid* instance types: "You can attach a
# persistent disk to a paid Render web service, private service, or background
# worker." A `free` plan with a `disk:` block is rejected, and a free instance's
# filesystem is wiped on redeploy and after it idles out — which would lose collected
# responses. Hence `plan: starter`.
#
# Attaching a disk also disables zero-downtime deploys, because Render must stop the
# old instance before starting the new one so two versions never write to the same
# file. A few seconds of downtime per deploy is the right trade here.
#
# If you would rather not pay: deploy to Railway (a volume is available on every
# tier — see railway.json), or drop the disk block and point DATABASE_URL at a
# managed Postgres. The app reads its database from that one variable, so no code
# changes are needed either way.
services:
  - type: web
    name: typeform-clone-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Migrations and seeding run at start, not build: the disk is only mounted at
    # runtime. `--if-empty` seeds a fresh database and leaves a populated one alone,
    # so redeploying never destroys responses collected from the live link.
    startCommand: >-
      alembic upgrade head &&
      python -m app.seed --if-empty &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: typeform-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # Four slashes: sqlite://// means an absolute path.
      - key: DATABASE_URL
        value: sqlite:////var/data/typeform.db
      # Set these in the dashboard once the Vercel URL is known.
      #   CORS_ORIGINS          e.g. https://your-app.vercel.app
      #   PUBLIC_FORM_BASE_URL  e.g. https://your-app.vercel.app/f
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_FORM_BASE_URL
        sync: false
