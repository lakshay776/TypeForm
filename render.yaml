# Render blueprint for the FastAPI backend.
#
# SQLite needs a real filesystem that survives restarts, so the service mounts a
# persistent disk and DATABASE_URL points at it. Without the disk, every deploy
# would silently reset to an empty database.
services:
  - type: web
    name: typeform-clone-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    disk:
      name: typeform-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/typeform.db
      # Set these two in the Render dashboard once the frontend URL is known.
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_FORM_BASE_URL
        sync: false
